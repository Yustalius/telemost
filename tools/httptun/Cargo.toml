[package]
name = "httptun"
version = "0.1.0"
edition = "2021"
publish = false
description = "HTTP-streaming TCP and UDP tunnel for fixed telemost port mappings"

[[bin]]
name = "httptun-server"
path = "src/bin/httptun-server.rs"

[[bin]]
name = "httptun-client"
path = "src/bin/httptun-client.rs"

# Versions are pinned to what telemost's Cargo.lock already resolved, so every
# crate is a cache hit and the rustls provider stays `ring` (no aws-lc-rs C build).
[dependencies]
tokio = { version = "1.44", features = ["full"] }
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
