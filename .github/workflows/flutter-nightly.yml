name: Flutter Nightly Build

on:
  # Telemost: ночная сборка по расписанию отключена — форк собирается вручную
  # и по тегу, иначе каждую ночь публикуется prerelease во всех платформах.
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
